[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc311-service-ops"
version = "0.1.0"
description = "Bounded NYC 311 observations, governed reporting, and release evidence"
requires-python = ">=3.12,<3.14"
dependencies = ["tzdata==2026.6"]

[project.optional-dependencies]
cloud = ["dbt-core==1.12.7", "dbt-bigquery==1.12.4", "google-cloud-storage==3.17.1"]

[project.scripts]
nyc311 = "nyc311.cli:main"

[tool.setuptools]
packages = ["nyc311"]
