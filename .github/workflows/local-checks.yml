name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock.txt
      - name: Install application and mocked cloud test dependencies
        run: python -m pip install -c requirements.lock.txt -e ".[cloud]"
      - name: Validate Python contracts and recovery behavior
        run: python -m nyc311 validate --output .local/ci/python-validation.json

  dbt:
    name: dbt validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked dbt and SQL parser dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Parse dbt, compile Jinja, and validate BigQuery SQL syntax offline
        run: python scripts/validate_dbt.py

  configuration:
    name: Configuration validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock.txt
      - name: Install configuration validator dependencies
        run: python -m pip install -c requirements.lock.txt -e . PyYAML==6.0.3
      - name: Validate tracked configuration and data contracts
        run: python scripts/validate_config.py
      - name: Validate infrastructure syntax and provisioning guardrails offline
        shell: pwsh
        run: ./infra/Test-Local.ps1
      - name: Validate Power BI source references and layout bounds
        run: python powerbi/validate_source.py --output .local/ci/powerbi-source.json
      - name: Validate Power BI CSV types and relationships
        run: python powerbi/validate_exports.py --output .local/ci/powerbi-exports.json
